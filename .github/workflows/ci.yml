name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      - run: python -m app --version
      - run: alembic upgrade head
      - run: pytest
